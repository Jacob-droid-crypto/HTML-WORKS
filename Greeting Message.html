<!DOCTYPE html>
<html>
    <head>
        <title>Greeting Message</title>
        <script>
            function showUsMessage(){
                document.getElementById("message").innerText = "Hello!,Have a great Day";
            }
        </script>
    </head>
    <body>
        <h2>Click the button to see a Surprise message</h2>
        <button onclick="return showUsMessage()">Click meeee</button>
        <p id="message"></p>
    </body>
</html>
