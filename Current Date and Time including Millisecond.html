<!DOCTYPE html>
<html>
<head>
  <title>Clock with Milliseconds</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    #clock {
      font-size: 50px;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="clock">00:00:00:000</div>

  <script>
    function updateDateTime() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0'); // fixed gethours -> getHours
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const milliseconds = now.getMilliseconds().toString().padStart(3, '0');

      // Fixed variable casing and corrected string syntax
      document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}:${milliseconds}`;
    }

    setInterval(updateDateTime, 50);
  </script>
</body>
</html>
