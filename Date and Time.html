<!DOCTYPE html>
<html>
<head>
    <title>Date and Time</title>
    <style>
        body {
            background-color: azure;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            color: blueviolet;
        }
        #datetime {
            color: chartreuse;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>Current Date and Time</h1>
    <p id="datetime"></p>

    <script>
        function dateTime() {
            const now = new Date();
            document.getElementById("datetime").innerHTML = now.toString();
        }
        // Call the function to display time when the page loads
        dateTime();
    </script>
</body>
</html>
